<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Consulta de CEP</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header, footer {
            background-color: #1769d2;
            height: 55px;
            width: 100%;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .caixa {
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 12px #0002;
        }

        h1 {
            color: black;
        }

        input, button {
            padding: 12px;
            margin: 5px;
        }

        button {
            background: #1769d2;
            color: white;
            border: none;
            cursor: pointer;
        }

        #resultado {
            margin-top: 20px;
            line-height: 1.6;
        }
    </style>
</head>

<body>

    <header></header>

    <main>
        <div class="caixa">

            <h1>Consulta de CEP</h1>

            <input type="text" id="cep"
            placeholder="Digite seu CEP" maxlength="9">

            <button onclick="buscarCEP()">Pesquisar</button>

            <p id="resultado"></p>

        </div>
    </main>

    <footer></footer>

    <script>
        async function buscarCEP() {
            let cep = document.getElementById('cep').value;
            cep = cep.replace(/\D/g, '');

            let resultado = document.getElementById('resultado');

            if (cep.length !== 8) {
                resultado.textContent = 'Digite um CEP válido!';
                return;
            }

            resultado.textContent = 'Consultando...';

            try {
                let resposta = await fetch(
                    `https://viacep.com.br/ws/${cep}/json/`
                );

                let dados = await resposta.json();

                if (dados.erro) {
                    resultado.textContent = 'CEP não encontrado!';
                } else {
                    resultado.innerHTML = `
                        Rua: ${dados.logradouro}<br>
                        Bairro: ${dados.bairro}<br>
                        Cidade: ${dados.localidade}<br>
                        Estado: ${dados.uf}
                    `;
                }

            } catch (erro) {
                resultado.textContent = 'Erro ao consultar CEP!';
            }
        }
    </script>

</body>
</html>
